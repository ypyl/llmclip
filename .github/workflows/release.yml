name: AutoHotkey Release Build

on:
  # This workflow triggers when a new tag is pushed (e.g., git push --tags)
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Matches tags like v1.0.0, v1.2.3, etc.

jobs:
  build_and_release:
    # Use a standard Windows runner since Ahk2Exe is a Windows tool
    runs-on: windows-latest

    permissions:
      contents: write
    
    # Define a variable for the output executable filename
    env:
      EXE_NAME: llmclip.exe
      
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📝 Read release notes
        id: notes
        # The first line of RELEASE_NOTES.md is the release title, the rest is
        # the body. Fails the run when the notes are missing or still describe
        # the previous release, so a tag never ships without notes.
        shell: pwsh
        run: |
          if (-not (Test-Path RELEASE_NOTES.md)) {
            throw "RELEASE_NOTES.md is missing. Write the notes for this release before tagging."
          }
          $lines = Get-Content RELEASE_NOTES.md
          $title = ($lines[0] -replace '^#\s*', '').Trim()
          if (-not $title.StartsWith("${{ github.ref_name }}")) {
            throw "RELEASE_NOTES.md starts with '$title', which does not begin with the tag '${{ github.ref_name }}'."
          }
          "title=$title" >> $env:GITHUB_OUTPUT
          $body = (($lines | Select-Object -Skip 1) -join "`n").Trim()
          $body | Out-File release-body.md -Encoding utf8
        
      - name: 📦 Compile AutoHotkey Script
        uses: benmusson/ahk2exe-action@v1.2.0
        with:
          # REQUIRED: The path and name of your AHK v2 script.
          in: main.ahk 
          
          # Optional: The name for the output executable. Using the env variable.
          out: ${{ env.EXE_NAME }} 
          
          # Optional: Specify the icon file if you have one. 
          icon: icon.ico 
          
          # Optional: Target architecture (x64 is default and recommended)
          # target: x64 
          
          # Optional: Use UPX compression (default)
          # compression: upx 

      - name: 📁 Prepare for Release (Zip the executable and dependencies)
        # Create a ZIP file for easy downloading and distribution
        run: |
          Compress-Archive -Path ${{ env.EXE_NAME }},mermaid.min.js,providers/providers.json,ui.html,marked.min.js,overtype@latest.js,WebView2Loader.dll -DestinationPath ${{ github.event.repository.name }}-${{ github.ref_name }}.zip

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Title and body both come from RELEASE_NOTES.md
          name: ${{ steps.notes.outputs.title }}
          body_path: release-body.md
          draft: false
          prerelease: false
          # Upload the compiled and zipped asset
          files: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
